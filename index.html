<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>鹈鹕骑行记</title>
  <style>
    :root {
      --ink: #18253f;
      --cream: #fff4d6;
      --coral: #ff715b;
      --gold: #ffc857;
      --pond: #173e59;
    }

    * { box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      margin: 0;
      overflow: hidden;
      color: var(--cream);
      background: #0b1732;
      font-family: Georgia, "Songti SC", serif;
    }

    .stage {
      position: relative;
      min-height: 100%;
      display: grid;
      place-items: center;
      isolation: isolate;
    }

    .stage::before {
      content: "";
      position: absolute;
      inset: 0;
      z-index: -2;
      background:
        radial-gradient(circle at 75% 19%, rgba(255, 200, 87, .28), transparent 14rem),
        linear-gradient(154deg, #10214a 0%, #233f6e 49%, #e66f54 100%);
    }

    .stage::after {
      content: "";
      position: absolute;
      inset: 0;
      z-index: 3;
      pointer-events: none;
      opacity: .14;
      mix-blend-mode: screen;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 120 120' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.8' numOctaves='2' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='.35'/%3E%3C/svg%3E");
    }

    .copy {
      position: absolute;
      z-index: 4;
      top: clamp(1.5rem, 6vw, 4.5rem);
      left: clamp(1.5rem, 7vw, 7rem);
      max-width: 22rem;
      animation: rise .9s cubic-bezier(.22, 1, .36, 1) both;
    }

    .eyebrow {
      margin: 0 0 .55rem;
      color: var(--gold);
      font: 700 .75rem/1.2 ui-monospace, SFMono-Regular, Menlo, monospace;
      letter-spacing: .15em;
      text-transform: uppercase;
    }

    h1 {
      margin: 0;
      color: var(--cream);
      font-size: clamp(2.3rem, 6vw, 5.6rem);
      line-height: .93;
      letter-spacing: -.04em;
      text-wrap: balance;
      text-shadow: 0 .12em 0 rgba(24, 37, 63, .16);
    }

    .dek {
      margin: 1rem 0 0;
      max-width: 17rem;
      color: rgba(255, 244, 214, .78);
      font-size: clamp(.95rem, 1.4vw, 1.1rem);
      line-height: 1.5;
    }

    .badge {
      position: absolute;
      right: clamp(1.5rem, 6vw, 6rem);
      bottom: clamp(1.5rem, 5vw, 4rem);
      z-index: 4;
      display: flex;
      align-items: center;
      gap: .65rem;
      color: rgba(255, 244, 214, .85);
      font: 700 .72rem/1 ui-monospace, SFMono-Regular, Menlo, monospace;
      letter-spacing: .12em;
      text-transform: uppercase;
      animation: rise 1.1s .2s cubic-bezier(.22, 1, .36, 1) both;
    }

    .badge::before {
      content: "";
      width: 2.5rem;
      height: 1px;
      background: var(--gold);
    }

    svg {
      display: block;
      width: min(100vw, 1100px);
      height: auto;
      max-height: 100vh;
      overflow: visible;
    }

    .bike-rider {
      transform-box: fill-box;
      transform-origin: center bottom;
      animation: riderBob .58s ease-in-out infinite alternate;
    }

    .pedal-arm {
      transform-box: fill-box;
      transform-origin: 50% 50%;
      animation: pedal .58s linear infinite;
    }

    .wheel-spin {
      transform-box: fill-box;
      transform-origin: 50% 50%;
      animation: wheel .82s linear infinite;
    }

    .beak {
      transform-box: fill-box;
      transform-origin: 5% 65%;
      animation: beak .9s ease-in-out infinite alternate;
    }

    .wing {
      transform-box: fill-box;
      transform-origin: 72% 78%;
      animation: wing .7s ease-in-out infinite alternate;
    }

    .water-line { animation: drift 4s linear infinite; }
    .water-line.slow { animation-duration: 6s; animation-delay: -1.8s; }

    @keyframes riderBob { from { transform: translateY(0); } to { transform: translateY(-5px); } }
    @keyframes pedal { to { transform: rotate(360deg); } }
    @keyframes wheel { to { transform: rotate(360deg); } }
    @keyframes beak { from { transform: rotate(-1deg); } to { transform: rotate(2deg); } }
    @keyframes wing { from { transform: rotate(1deg); } to { transform: rotate(-4deg); } }
    @keyframes drift { from { transform: translateX(-90px); } to { transform: translateX(90px); } }
    @keyframes rise { from { opacity: 0; transform: translateY(16px); } to { opacity: 1; transform: translateY(0); } }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation-duration: .001ms !important; animation-iteration-count: 1 !important; }
    }
  </style>
</head>
<body>
  <main class="stage" aria-label="黄昏湿地里，一只鹈鹕骑着自行车掠过水面">
    <div class="copy">
      <p class="eyebrow">marsh route / 07:24 pm</p>
      <h1>鹈鹕骑行记</h1>
      <p class="dek">风从芦苇间穿过，今天也准时出发。</p>
    </div>

    <svg viewBox="0 0 1100 720" role="img" aria-labelledby="scene-title scene-desc">
      <title id="scene-title">一只鹈鹕骑自行车</title>
      <desc id="scene-desc">橙色鹈鹕在黄昏湿地上骑着红色自行车，车轮和脚踏持续旋转。</desc>
      <defs>
        <linearGradient id="pond" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0" stop-color="#21546a" />
          <stop offset="1" stop-color="#0d2d49" />
        </linearGradient>
        <linearGradient id="feather" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0" stop-color="#fff0ce" />
          <stop offset=".65" stop-color="#f3c77b" />
          <stop offset="1" stop-color="#df855d" />
        </linearGradient>
        <linearGradient id="beakFill" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0" stop-color="#ffcf65" />
          <stop offset="1" stop-color="#e8704f" />
        </linearGradient>
        <filter id="softShadow" x="-30%" y="-30%" width="160%" height="160%">
          <feGaussianBlur stdDeviation="12" />
        </filter>
      </defs>

      <!-- sun and distant sky -->
      <circle cx="823" cy="145" r="74" fill="#ffc857" opacity=".92" />
      <circle cx="823" cy="145" r="102" fill="#ffc857" opacity=".1" />
      <path d="M0 337 Q120 274 255 331 T500 325 T760 333 T1100 295 V470 H0Z" fill="#1c3154" opacity=".72" />
      <path d="M0 382 Q145 316 284 379 T566 364 T840 382 T1100 347 V484 H0Z" fill="#182844" />

      <!-- reeds -->
      <g fill="none" stroke-linecap="round">
        <g stroke="#244a54" stroke-width="7" opacity=".9">
          <path d="M90 470 Q90 368 65 291" /><path d="M115 472 Q138 359 148 284" /><path d="M153 470 Q151 352 184 306" />
          <path d="M979 462 Q965 343 982 265" /><path d="M1010 466 Q1033 361 1065 314" /><path d="M935 468 Q929 357 907 289" />
        </g>
        <g stroke="#36685d" stroke-width="4" opacity=".8">
          <path d="M42 470 Q35 394 20 351" /><path d="M180 470 Q206 381 232 347" /><path d="M946 468 Q917 382 884 349" /><path d="M1074 468 Q1088 384 1100 345" />
        </g>
      </g>

      <!-- pond -->
      <path d="M0 426 Q210 392 408 426 T820 421 T1100 410 V720 H0Z" fill="url(#pond)" />
      <ellipse cx="542" cy="610" rx="346" ry="36" fill="#081b32" opacity=".38" filter="url(#softShadow)" />
      <g fill="none" stroke="#5c9ca0" stroke-linecap="round" opacity=".62">
        <path class="water-line" d="M53 529 Q121 516 189 529 T326 529" stroke-width="4" />
        <path class="water-line slow" d="M731 505 Q798 493 866 505 T1004 505" stroke-width="3" />
        <path class="water-line" d="M112 655 Q196 642 281 655 T450 655" stroke-width="5" />
        <path class="water-line slow" d="M690 666 Q767 653 845 666 T1000 666" stroke-width="4" />
        <path d="M384 571 Q459 559 534 571 T685 571" stroke-width="3" />
      </g>
      <g fill="#7eb3a2" opacity=".8">
        <path d="M79 607 q20-20 40 0 q-20-4-40 0Z" /><path d="M942 571 q16-17 33 0 q-16-4-33 0Z" />
      </g>

      <!-- bicycle shadow -->
      <ellipse cx="565" cy="574" rx="239" ry="20" fill="#071a2c" opacity=".45" />

      <!-- bicycle -->
      <g stroke="#ff715b" stroke-width="9" fill="none" stroke-linecap="round" stroke-linejoin="round">
        <path d="M380 535 L494 536 L550 425 L625 536 L733 536 L625 536 L494 536 L550 425" />
        <path d="M550 425 L527 385" /><path d="M514 384 L545 384" />
        <path d="M733 536 L751 464" /><path d="M736 465 L770 465" />
      </g>
      <g stroke="#ffb26f" stroke-width="5" fill="none" opacity=".9">
        <path d="M380 535 L380 470" /><path d="M733 536 L733 470" />
      </g>
      <g class="wheel-spin" stroke="#f6d6a0" stroke-width="6" fill="none">
        <circle cx="380" cy="535" r="72" />
        <g stroke-width="2" opacity=".8">
          <path d="M380 463V607 M308 535H452 M329 484L431 586 M329 586L431 484" />
        </g>
      </g>
      <g class="wheel-spin" stroke="#f6d6a0" stroke-width="6" fill="none">
        <circle cx="733" cy="535" r="72" />
        <g stroke-width="2" opacity=".8">
          <path d="M733 463V607 M661 535H805 M682 484L784 586 M682 586L784 484" />
        </g>
      </g>
      <g class="pedal-arm" stroke="#ffc857" stroke-width="6" stroke-linecap="round">
        <path d="M550 536 L576 565" /><path d="M576 565 h24" /><path d="M550 536 L523 507" /><path d="M499 507 h24" />
      </g>

      <!-- pelican rider -->
      <g class="bike-rider">
        <!-- body -->
        <path d="M483 411 Q472 343 512 290 Q552 241 625 264 Q683 283 692 348 Q699 397 660 431 Q604 469 532 442 Q495 432 483 411Z" fill="url(#feather)" stroke="#18253f" stroke-width="7" />
        <!-- wing -->
        <path class="wing" d="M555 316 Q608 301 666 336 Q646 387 582 405 Q550 395 534 366 Q531 338 555 316Z" fill="#d99362" stroke="#18253f" stroke-width="7" />
        <path d="M566 337 Q610 350 638 369" fill="none" stroke="#f4bb78" stroke-width="7" stroke-linecap="round" opacity=".7" />
        <!-- neck -->
        <path d="M535 310 Q514 266 535 222 Q557 180 604 182 Q644 185 654 224 Q658 258 627 294 L603 332Z" fill="#fff1d0" stroke="#18253f" stroke-width="7" />
        <!-- head -->
        <path d="M529 198 Q538 148 590 136 Q653 123 683 167 Q706 202 676 235 Q649 261 597 246 Q548 236 529 198Z" fill="url(#feather)" stroke="#18253f" stroke-width="7" />
        <!-- crest -->
        <path d="M552 151 Q528 117 545 91 Q568 112 579 143 Q579 108 603 88 Q614 119 601 145 Q631 111 658 106 Q650 139 621 160Z" fill="#e27d59" stroke="#18253f" stroke-width="7" stroke-linejoin="round" />
        <!-- beak -->
        <path class="beak" d="M675 190 Q734 192 789 229 Q758 260 692 245 Q661 235 653 213Z" fill="url(#beakFill)" stroke="#18253f" stroke-width="7" stroke-linejoin="round" />
        <path d="M685 224 Q739 231 773 236" fill="none" stroke="#a44848" stroke-width="4" stroke-linecap="round" />
        <!-- eye -->
        <circle cx="640" cy="183" r="10" fill="#18253f" /><circle cx="643" cy="180" r="3" fill="#fff8e6" />
        <!-- feet and legs -->
        <path d="M558 410 Q548 464 527 500" fill="none" stroke="#d9754e" stroke-width="13" stroke-linecap="round" />
        <path d="M628 420 Q622 467 589 520" fill="none" stroke="#d9754e" stroke-width="13" stroke-linecap="round" />
        <path d="M514 503 q17 10 31 0 M577 522 q18 10 30-2" fill="none" stroke="#ffc857" stroke-width="8" stroke-linecap="round" />
        <!-- handlebar grip -->
        <path d="M621 392 Q632 387 646 390" fill="none" stroke="#18253f" stroke-width="7" stroke-linecap="round" />
      </g>

      <!-- foreground reeds -->
      <g fill="none" stroke="#2b5f5c" stroke-width="6" stroke-linecap="round" opacity=".9">
        <path d="M249 720 Q263 632 239 561" /><path d="M279 720 Q288 628 321 583" /><path d="M875 720 Q858 632 883 572" /><path d="M914 720 Q903 642 930 596" />
      </g>
    </svg>

    <div class="badge" aria-hidden="true">ride the tide · loop 01</div>
  </main>
</body>
</html>
